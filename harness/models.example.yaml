# ─────────────────────────────────────────────────────────────────────────
# Which model answers which kind of request.
#
# THIS FILE IS THE LLM SWAP POINT. Nothing in the harness code names a model
# or a vendor. Change a line here, then:
#
#     kubectl -n assistant rollout restart deploy/harness
#     # or, without a restart:
#     curl -XPOST -H "X-API-Key: $KEY" https://<harness>/v1/admin/reload
#
# Format is  provider/model. Supported providers:
#   anthropic         native Messages API (tool use, thinking, effort)
#   openai            /v1/chat/completions
#   google-ai-studio  generateContent
#   openrouter        one key, hundreds of models — refs keep their own
#                     slashes, e.g. openrouter/meta-llama/llama-3.3-70b-instruct
#   groq              fast open-weights inference
#   workers-ai        Cloudflare's own models, e.g.
#                     workers-ai/@cf/meta/llama-3.3-70b-instruct-fp8-fast
#
# `fallback` is used when the primary errors, rate-limits or 5xxs. It is not a
# cost optimisation — it is what keeps the house answering when a vendor is
# having a bad day. Pick one from a different vendor.
# ─────────────────────────────────────────────────────────────────────────

routes:
  # Typed conversations: room to reason, room to chain several tools.
  chat:
    primary: anthropic/claude-opus-5
    fallback: openai/gpt-4o
    max_tokens: 4096
    options:
      thinking: adaptive
      effort: medium

  # Spoken conversations: the reply is read aloud, so it must be short and
  # must arrive fast. Lower ceiling, no thinking, cheaper fallback.
  voice:
    primary: anthropic/claude-opus-5
    fallback: google-ai-studio/gemini-2.0-flash
    max_tokens: 600
    options:
      effort: low

# Speech to text. gpt-4o-transcribe is markedly better than whisper-1 on
# accented English and on Spanish; whisper-1 is the cheap safety net.
stt:
  primary: openai/gpt-4o-transcribe
  fallback: openai/whisper-1
  # language: es    # uncomment to pin; otherwise it is auto-detected

# Text to speech.
#   OpenAI  — voice is a name: alloy, echo, fable, onyx, nova, shimmer
#   ElevenLabs — voice must be a voice *id* from your ElevenLabs account,
#                and `primary` looks like elevenlabs/eleven_turbo_v2_5
tts:
  primary: openai/tts-1
  fallback: ""
  voice: nova
  format: mp3

# Optional. Replaces the built-in system prompt entirely when set.
# system_prompt: |
#   You are ...
