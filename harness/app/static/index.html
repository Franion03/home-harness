<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Harness</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Harness</h1>
  <button id="settings-btn" class="icon" aria-label="Settings" title="Settings">&#9881;</button>
</header>

<div id="banner" class="banner" hidden></div>

<main id="log" aria-live="polite">
  <div class="empty" id="empty">
    <p>Hold the button and speak, or type below.</p>
    <p class="hint">&ldquo;Turn off the kitchen light&rdquo; &middot; &ldquo;What&rsquo;s on my calendar tomorrow?&rdquo;</p>
  </div>
</main>

<footer>
  <form id="text-form" autocomplete="off">
    <input id="text-input" type="text" placeholder="Type a message&hellip;" aria-label="Message">
    <button id="send-btn" type="submit" aria-label="Send">&#10148;</button>
  </form>
  <button id="mic" class="mic" aria-label="Hold to talk">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
      <path d="M18 11a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.1A6 6 0 0 0 18 11z"/>
    </svg>
    <span id="mic-label">Hold to talk</span>
  </button>
</footer>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <label>Server URL
      <input id="cfg-url" type="url" placeholder="https://assistant.example.com">
    </label>
    <label>API key
      <input id="cfg-key" type="password" placeholder="HARNESS_API_KEY">
    </label>
    <label class="row">
      <input id="cfg-speak" type="checkbox" checked> Speak replies aloud
    </label>
    <p class="session">Session <code id="cfg-session"></code></p>
    <menu>
      <button value="reset" class="ghost">New conversation</button>
      <button value="save" class="primary">Save</button>
    </menu>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
