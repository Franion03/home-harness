name: Seal Secrets

# ==============================================
# Same hybrid pipeline as arr-stack:
#   GitHub Secrets -> kubeseal -> git -> ArgoCD -> SealedSecrets -> K8s Secret
#
# 1. Credentials live in GitHub Secrets (source of truth)
# 2. This workflow seals them with the cluster's public cert
# 3. The encrypted SealedSecret is committed to the repo
# 4. ArgoCD deploys it; the SealedSecrets controller decrypts it in-cluster
#
# The cert in .github/sealed-secrets-cert.pem is a PUBLIC key -- safe to
# commit. Fetch it with:
#   kubeseal --fetch-cert --controller-name=sealed-secrets-controller \
#            --controller-namespace=kube-system > .github/sealed-secrets-cert.pem
# ==============================================

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/sealed-secrets-cert.pem'
      - '.github/workflows/seal-secrets.yml'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeseal
        run: |
          KUBESEAL_VERSION="0.28.0"
          curl -sLo kubeseal.tar.gz \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz"
          tar -xzf kubeseal.tar.gz kubeseal
          sudo install -m 755 kubeseal /usr/local/bin/kubeseal
          kubeseal --version

      - name: Seal harness secrets
        env:
          CF_ACCOUNT_ID:        ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_GATEWAY:        ${{ vars.CF_AI_GATEWAY }}
          CF_AI_GATEWAY_TOKEN:  ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY:    ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          CF_WORKERS_AI_TOKEN:  ${{ secrets.CF_WORKERS_AI_TOKEN }}
          ELEVENLABS_API_KEY:   ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPGRAM_API_KEY:     ${{ secrets.DEEPGRAM_API_KEY }}
          HA_URL:               ${{ vars.HA_URL }}
          HA_TOKEN:             ${{ secrets.HA_TOKEN }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID:   ${{ vars.GOOGLE_CALENDAR_ID }}
          HARNESS_API_KEY:      ${{ secrets.HARNESS_API_KEY }}
        run: |
          if [ ! -f .github/sealed-secrets-cert.pem ]; then
            echo "::error::.github/sealed-secrets-cert.pem is missing. Fetch it with kubeseal --fetch-cert."
            exit 1
          fi

          # Do not seal a set of empty values -- that would commit a
          # SealedSecret that wipes working credentials the moment ArgoCD
          # applies it. HARNESS_API_KEY is the sentinel: nothing works
          # without it, so if it is unset the repository secrets are not
          # configured yet.
          if [ -z "$HARNESS_API_KEY" ]; then
            echo "::warning::HARNESS_API_KEY is not set in repository secrets. Skipping — configure the secrets under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 0
          fi

          args=()
          for k in CF_ACCOUNT_ID CF_AI_GATEWAY CF_AI_GATEWAY_TOKEN \
                   ANTHROPIC_API_KEY OPENAI_API_KEY GOOGLE_AI_API_KEY \
                   OPENROUTER_API_KEY GROQ_API_KEY CF_WORKERS_AI_TOKEN \
                   ELEVENLABS_API_KEY DEEPGRAM_API_KEY \
                   HA_URL HA_TOKEN \
                   GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN \
                   GOOGLE_CALENDAR_ID HARNESS_API_KEY; do
            args+=(--from-literal="$k=${!k}")
          done

          kubectl create secret generic harness-secrets \
            --namespace=assistant \
            "${args[@]}" \
            --dry-run=client -o yaml \
          | kubeseal --cert .github/sealed-secrets-cert.pem \
                     --format yaml -o deploy/base/sealed-secret.yaml

          echo "==> SealedSecret written."

      - name: Commit sealed secret
        run: |
          # The seal step exits early when the repository secrets are not
          # configured, so the file may legitimately not exist.
          if [ ! -f deploy/base/sealed-secret.yaml ]; then
            echo "::notice::Nothing was sealed, so there is nothing to commit."
            exit 0
          fi

          # Stage first: 'git diff' alone reports no change for a file that is
          # still untracked, which would silently skip the very first seal.
          git add deploy/base/sealed-secret.yaml
          if git diff --cached --quiet; then
            echo "::notice::Sealed secret unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(secrets): update sealed harness secrets"
          git push
          echo "::notice::Sealed secret committed and pushed."
