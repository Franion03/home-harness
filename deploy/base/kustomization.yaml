apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: assistant

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: harness-config
    files:
      - models.yaml

# The generated name carries a content hash, so editing models.yaml rolls the
# deployment automatically.
generatorOptions:
  disableNameSuffixHash: false
