apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness
  namespace: assistant
  labels:
    app: harness
spec:
  replicas: 1
  strategy:
    # The session database is RWO on a single PVC, so the old pod must go
    # before the new one can mount it.
    type: Recreate
  selector:
    matchLabels:
      app: harness
  template:
    metadata:
      labels:
        app: harness
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: harness
          image: ghcr.io/franion03/home-harness:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: harness-secrets
          env:
            - name: TZ
              value: "Europe/Madrid"
            - name: HARNESS_DB
              value: "/data/harness.db"
            - name: HARNESS_ROUTES
              value: "/config/models.yaml"
            - name: LOG_LEVEL
              value: "INFO"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: harness-data
        - name: config
          configMap:
            name: harness-config
