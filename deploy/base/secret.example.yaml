# Reference only -- never commit real values.
#
# In the cluster this Secret is produced by sealing:
#   scripts/seal-secrets.sh          (local, from your shell environment)
#   .github/workflows/seal-secrets.yml   (CI, from GitHub Secrets)
#
# Only the keys you actually use need values; the harness disables any
# integration whose credentials are missing and says so in /health.
apiVersion: v1
kind: Secret
metadata:
  name: harness-secrets
  namespace: assistant
type: Opaque
stringData:
  # --- Cloudflare AI Gateway -------------------------------------------
  CF_ACCOUNT_ID: ""            # Cloudflare dashboard -> account id
  CF_AI_GATEWAY: "home-harness"
  CF_AI_GATEWAY_TOKEN: ""      # only if the gateway is set to authenticated

  # --- Model vendors (whichever models.yaml names) ----------------------
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GOOGLE_AI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  GROQ_API_KEY: ""
  CF_WORKERS_AI_TOKEN: ""
  ELEVENLABS_API_KEY: ""
  DEEPGRAM_API_KEY: ""

  # --- Home Assistant ---------------------------------------------------
  HA_URL: "http://192.168.1.117:8123"
  HA_TOKEN: ""                 # HA -> profile -> Long-lived access tokens

  # --- Google Calendar (scripts/google_oauth.py prints these) -----------
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_REFRESH_TOKEN: ""
  GOOGLE_CALENDAR_ID: "primary"

  # --- Harness ----------------------------------------------------------
  HARNESS_API_KEY: ""          # shared secret; generate with `openssl rand -hex 24`
