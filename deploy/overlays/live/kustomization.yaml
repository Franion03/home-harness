# Registry-free shape: a stock python image, the harness source mounted from
# ConfigMaps, dependencies installed into an emptyDir at startup.
#
# This exists so the harness can run before any image has been built and
# pushed. Regenerate the source ConfigMaps first:
#
#     scripts/render-source-configmap.sh
#     kubectl apply -k deploy/overlays/live
#
# Once GHCR has an image, switch to deploy/overlays/ghcr.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: assistant

resources:
  - ../../base
  - source-configmap.yaml
  - static-configmap.yaml

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: harness
